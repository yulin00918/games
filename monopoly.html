<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>正負數大富翁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: square ring board (36 spaces on a 10×10 perimeter) on grid paper, with a ledger-style side panel for actions, players and the log. */
:root{
  --paper:#eef3f1; --grid:rgba(40,90,90,.09); --card:#ffffff; --card-2:#f6f8f7;
  --ink:#1b2729; --ink-2:#4f5f62; --line:#cfdad7;
  --pos:#1d63a8; --neg:#cc3a26; --accent:#e39a12; --accent-ink:#2a1c00;
  --k-conv:#14907e; --k-book:#4b56b8; --k-drink:#e0782a; --k-chicken:#9a5a2b; --k-cram:#8a49b0; --k-cinema:#c23d78;
  --s-chance:#d9a400; --s-fate:#d0516a; --s-school:#3f9a46; --s-zone:#6a7a7d; --s-start:#1b2729;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(20,50,50,.35);
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111a1b; --grid:rgba(140,200,200,.06); --card:#1b2627; --card-2:#162021;
  --ink:#e6eeec; --ink-2:#9fb0b2; --line:#2e3c3e;
  --pos:#6cb2f5; --neg:#ff7a63; --accent:#f2b23a; --accent-ink:#241700;
  --k-conv:#2fbca7; --k-book:#8790ec; --k-drink:#f39a52; --k-chicken:#c88a55; --k-cram:#b47be0; --k-cinema:#ec6fa3;
  --s-chance:#e8bd2c; --s-fate:#ec7a8f; --s-school:#64be6b; --s-zone:#8b9c9f; --s-start:#e6eeec;
  --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a1b; --grid:rgba(140,200,200,.06); --card:#1b2627; --card-2:#162021;
  --ink:#e6eeec; --ink-2:#9fb0b2; --line:#2e3c3e;
  --pos:#6cb2f5; --neg:#ff7a63; --accent:#f2b23a; --accent-ink:#241700;
  --k-conv:#2fbca7; --k-book:#8790ec; --k-drink:#f39a52; --k-chicken:#c88a55; --k-cram:#b47be0; --k-cinema:#ec6fa3;
  --s-chance:#e8bd2c; --s-fate:#ec7a8f; --s-school:#64be6b; --s-zone:#8b9c9f; --s-start:#e6eeec;
  --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;max-width:1400px;margin:0 auto;align-items:start}
.board-wrap{min-width:0}
.board{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:3px;aspect-ratio:1;
  width:min(100%,calc(100vh - 28px));max-width:100%;margin:0 auto;font-size:clamp(7px,1.02vw,13px)}
.cell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden;
  display:flex;flex-direction:column;padding:.35em .4em .3em;text-align:left;min-width:0;min-height:0;transition:transform .15s}
.cell:hover{transform:translateY(-1px)}
.cell .stripe{position:absolute;inset:0 0 auto 0;height:.42em;background:var(--kc,var(--s-zone))}
.cell .idx{position:absolute;top:.5em;right:.4em;font-family:var(--f-num);font-size:.8em;color:var(--ink-2);opacity:.75}
.cell .kind{margin-top:.45em;font-size:.82em;color:var(--kc,var(--ink-2));font-weight:700;letter-spacing:.04em;white-space:nowrap}
.cell .nm{font-family:var(--f-display);font-weight:700;font-size:1.28em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .sub{font-size:.8em;color:var(--ink-2);line-height:1.2;overflow:hidden}
.cell .own{position:absolute;left:0;right:0;bottom:0;height:1.45em;background:var(--oc);color:#fff;font-size:.82em;font-weight:700;
  display:flex;align-items:center;justify-content:flex-end;padding:0 .4em;font-family:var(--f-num)}
.cell .toks{position:absolute;left:.25em;bottom:1.7em;display:flex;flex-wrap:wrap;gap:2px;max-width:calc(100% - .5em)}
.cell.corner{background:var(--card-2)}
.cell.here{box-shadow:0 0 0 3px var(--accent) inset}
.tok{width:1.55em;height:1.55em;border-radius:50%;background:var(--pc);color:#fff;font-size:.85em;font-weight:900;display:grid;place-items:center;
  border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tok.cur{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

.center{grid-row:2/10;grid-column:2/10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;padding:1.2em;text-align:center;min-width:0;min-height:0;overflow:hidden}
.center h1{font-family:var(--f-display);font-weight:700;font-size:4em;line-height:1;margin:0;letter-spacing:.04em;text-wrap:balance}
.center h1 .pm{color:var(--neg)} .center h1 .pp{color:var(--pos)}
.center .tag{font-size:1.1em;color:var(--ink-2);margin:0}
.daybar{display:flex;gap:.35em;justify-content:center;flex-wrap:wrap}
.daybar span{width:2.3em;height:2.3em;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-num);font-size:1em;color:var(--ink-2);background:var(--card)}
.daybar span.done{background:var(--ink-2);color:var(--card);border-color:var(--ink-2)}
.daybar span.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.tray{display:flex;align-items:center;gap:.6em;min-height:4.4em;font-size:1.2em;flex-wrap:wrap;justify-content:center}
.tray .expr{font-family:var(--f-num);font-size:1.25em}
.lastlog{font-size:1.15em;max-width:36em;min-height:2.6em;color:var(--ink)}
.center .buttons{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.35em 1em;font-size:1.05em}
.ghost:hover{border-color:var(--ink-2)}

/* dice */
.die{width:2.6em;height:2.6em;border-radius:.5em;background:var(--card);border:2px solid var(--dc,var(--ink-2));display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:.3em;gap:1px;flex:none}
.die i{border-radius:50%;margin:16%;}
.die i.on{background:var(--dc,var(--ink))}
.die.q{display:grid;place-items:center;font-family:var(--f-num);font-weight:600;color:var(--dc);grid-template:1fr/1fr}
.die.sgn{display:grid;place-items:center;grid-template:1fr/1fr;font-size:1.5em;font-weight:900;color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.d-move{--dc:var(--pos)} .d-pay{--dc:var(--neg)} .d-collect{--dc:var(--k-conv)} .d-plain{--dc:var(--ink-2)}
.die.rolling{animation:shake .5s linear}
@keyframes shake{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}

/* side */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.stage{padding:16px;min-height:220px}
.stage h2{font-family:var(--f-display);font-size:1.45em;margin:0 0 .3em;line-height:1.25;text-wrap:balance}
.stage .who{display:flex;align-items:center;gap:.5em;font-size:.9em;color:var(--ink-2);margin-bottom:.4em}
.stage .who .tok{font-size:13px}
.stage p{margin:.35em 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:.5em 1em;font-weight:700;font-size:1em;line-height:1.3}
.btn:hover{background:var(--card-2)}
.btn.main{background:var(--ink);color:var(--card)}
.btn.main:hover{opacity:.9}
.btn.alt{border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn small{display:block;font-weight:400;font-size:.8em;opacity:.8}

.cardface{border-radius:10px;border:2px solid var(--cc);padding:12px 14px;margin:8px 0;background:linear-gradient(var(--card),var(--card)) padding-box;position:relative}
.cardface .ck{font-size:.8em;font-weight:700;color:var(--cc);letter-spacing:.12em}
.cardface .cn{font-family:var(--f-display);font-size:1.5em;font-weight:700;line-height:1.2}
.cardface .cd{color:var(--ink-2)}
.c-chance{--cc:var(--s-chance)} .c-fate{--cc:var(--s-fate)} .c-ability{--cc:var(--k-cram)} .c-shop{--cc:var(--accent)}

.calc{background:var(--card-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-family:var(--f-num);font-size:.95em;line-height:1.9;overflow-x:auto}
.calc .lab{font-family:var(--f-body);font-size:.85em;color:var(--ink-2)}
.calc .res{font-size:1.25em;font-weight:600}

/* builder */
.bld{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bld .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bld .diebtn{padding:0;border:none;background:none;border-radius:.6em;font-size:15px}
.bld .diebtn:disabled{opacity:.25}
.bld .op{min-width:2.6em;height:2.4em;border:1.5px solid var(--line);border-radius:8px;background:var(--card-2);font-family:var(--f-num);font-size:1.15em;font-weight:600}
.bld .op:hover{border-color:var(--ink-2)}
.bld .exprbox{min-height:2.4em;border:2px solid var(--ink);border-radius:8px;padding:.3em .6em;font-family:var(--f-num);font-size:1.3em;display:flex;align-items:center;flex-wrap:wrap;gap:.25em;background:var(--card)}
.bld .exprbox .ph{color:var(--ink-2);font-family:var(--f-body);font-size:.75em}
.bld .msg{font-size:.92em;min-height:1.4em}
.bld .msg.err{color:var(--neg)}
.adj{display:flex;flex-direction:column;align-items:center;gap:2px}
.adj button{border:1px solid var(--line);background:var(--card-2);border-radius:6px;width:2.6em;font-size:.8em;line-height:1.5}

/* questions & flow */
.flow{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px;font-size:.78em}
.flow span{padding:.1em .55em;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.flow span.done{color:var(--ink-2);opacity:.6}
.flow span.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:700}
.qbox{border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--card-2)}
.qcat{display:inline-block;font-size:.75em;font-weight:700;letter-spacing:.1em;color:var(--ink-2);margin-bottom:2px}
.qq{font-size:1.65em;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.hintbox{border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.hintbox b{display:block;font-size:.8em;letter-spacing:.1em}
.msgline{min-height:1.4em;font-size:.95em}
.okline{font-family:var(--f-display);font-size:1.6em;font-weight:700;margin:.2em 0}
table.stats{min-width:760px}
table.stats td,table.stats th{text-align:center}

/* players */
.players{padding:8px}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px;border-radius:8px}
.pl.cur{background:var(--card-2);box-shadow:inset 3px 0 0 var(--pc)}
.pl .tok{font-size:14px}
.pl .pn{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .pm{font-family:var(--f-num);font-weight:600;font-size:1.1em;text-align:right}
.pl .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8em;color:var(--ink-2)}
.lv{display:inline-flex;align-items:center;gap:3px}
.lv b{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--line)}
.lv b.on{background:var(--dc)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 .55em;font-size:.95em;background:var(--card)}
.chip.z{border-color:var(--accent);color:var(--ink)}

.log{padding:10px 14px;max-height:260px;overflow:auto;font-size:.88em}
.log h3,.players h3{font-size:.78em;letter-spacing:.14em;color:var(--ink-2);margin:4px 0 6px;font-weight:700}
.players h3{padding:0 8px}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.log li{border-bottom:1px dashed var(--line);padding-bottom:4px}
.log li .d{font-family:var(--f-num);color:var(--ink-2);margin-right:.4em;font-size:.9em}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,22,.55);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--card);border-radius:14px;max-width:min(960px,100%);width:100%;max-height:100%;overflow:auto;padding:22px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
.modal .box.narrow{max-width:560px}
.modal h2{font-family:var(--f-display);font-size:1.8em;margin:0 0 .4em}
.modal h3{font-size:1.05em;margin:1em 0 .3em}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-size:.85em;color:var(--ink-2);font-weight:700}
input[type=text],input[type=number],input.ans,select{font:inherit;border:1.5px solid var(--line);border-radius:7px;padding:.4em .6em;background:var(--card);color:var(--ink);min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pgrid .pin{display:flex;align-items:center;gap:6px}
.pgrid .pin input{width:100%}
.check{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.check input{margin-top:.35em}

.tblwrap{overflow-x:auto}
table.ledger{border-collapse:collapse;width:100%;font-size:.92em;min-width:520px}
table.ledger th,table.ledger td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.ledger th{background:var(--card-2);font-size:.85em;letter-spacing:.06em}
table.ledger td.n{font-family:var(--f-num);text-align:right;white-space:nowrap}
table.ledger .ent{display:flex;justify-content:space-between;gap:10px}
table.ledger .ent span:last-child{font-family:var(--f-num);white-space:nowrap}
table.ledger tr.today{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1.5px solid var(--line);border-radius:999px;padding:.25em .9em;background:var(--card)}
.tabs button.on{border-color:var(--pc);box-shadow:inset 0 -3px 0 var(--pc);font-weight:700}

.settle{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) 150px 150px 70px;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px}
.srow .ents{font-size:.88em;display:flex;flex-direction:column;gap:2px}
.srow .ents div{display:flex;justify-content:space-between;gap:8px}
.srow .ents span:last-child{font-family:var(--f-num)}
.srow input{width:100%;font-family:var(--f-num)}
.srow .mark{font-size:1.3em;font-weight:900;text-align:center}
.srow .hint{font-size:.8em;color:var(--ink-2)}
.rank{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.rank div{display:grid;grid-template-columns:2.2em auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.rank .r{font-family:var(--f-display);font-size:1.6em;font-weight:700;text-align:center}
.rank .m{font-family:var(--f-num);font-weight:600;font-size:1.2em}
.rules ol{padding-left:1.3em} .rules li{margin:.3em 0}
.shopinfo .calc input{width:4.2em;font-family:var(--f-num)}


/* online play */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;max-width:1400px;margin:0 auto 10px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.topbar .code{font-family:var(--f-display);font-weight:700;font-size:1.2em}
.topbar .tok{font-size:12px;display:inline-grid;vertical-align:middle}
.topbar .grow{flex:1}
.seatctl{display:flex;flex-wrap:wrap;gap:6px}
.ghost.sm,.btn.sm{font-size:.85em;padding:.3em .8em}
.spectbar{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:-4px -4px 10px;border-radius:8px;background:var(--card-2);font-size:.95em}
.spectbar .tok{font-size:13px}
.spect{opacity:.85;pointer-events:none}
.waitdots{display:flex;gap:6px;margin-top:10px}
.waitdots i{width:9px;height:9px;border-radius:50%;background:var(--ink-2);animation:wd 1.2s infinite}
.waitdots i:nth-child(2){animation-delay:.2s}.waitdots i:nth-child(3){animation-delay:.4s}
@keyframes wd{50%{opacity:.2}}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.homebtn{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-2)}
.homebtn:hover{border-color:var(--ink)}
.homebtn b{font-family:var(--f-display);font-size:1.35em}
.homebtn span{font-size:.85em;color:var(--ink-2)}
.dash{max-width:1400px;margin:0 auto}
.dashhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.dashhead h1{font-family:var(--f-display);font-size:2.2em;margin:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.tcard header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard h3{font-family:var(--f-display);font-size:1.5em;margin:0}
.tcard h3 .num{font-size:1.1em;letter-spacing:.06em}
.tcard.playing{box-shadow:inset 0 3px 0 var(--pos),var(--shadow)}
.tcard.over{opacity:.85}
.qr{margin:10px 0;background:#fff;padding:6px;border-radius:6px;width:max-content}
.qr img,.qr canvas{display:block}
table.mini{width:100%;border-collapse:collapse;font-size:.9em}
table.mini td{padding:4px 2px;border-bottom:1px dashed var(--line)}
table.mini td.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
table.mini .tok{font-size:11px;display:inline-grid;vertical-align:middle}
.warnline{border-left:4px solid var(--accent);padding:6px 10px;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:0 8px 8px 0}
.lobby{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.lobby li{display:flex;align-items:center;gap:8px}
.lobby .tok{font-size:13px}
@media (max-width:1000px){
  .app{display:flex;flex-direction:column}
  .side{display:contents}
  #stage{order:-1}
}
@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr)}
  .board{width:100%;font-size:clamp(5.5px,1.55vw,12px)}

  market(){let A=hund(3,9),B=hund(2,9);while(B===A)B=hund(2,9);return {text:`夜市擺攤，上午賣飲料賺了 ${A} 元，下午進貨花了 ${B} 元。用「賺是正數、花是負數」算出今天的收支。`,
    q:`(+${A}) + (−${B})`,a:A-B,hint:'異號相加：絕對值大的減小的，符號跟著絕對值大的。',steps:[`收入記 +${A}，支出記 −${B}`,`${Math.max(A,B)} − ${Math.min(A,B)} = ${Math.abs(A-B)}`,`${A>B?'收入':'支出'}比較多，答案是 ${sn(A-B)}`]};},
  groupbuy(){const k=hund(2,6),N=4*k;return {text:`你們 4 個人一起團購，總共要付 ${N} 元，大家平均分攤。用負數表示付出去的錢，你的收支是多少？`,
    q:`(−${N}) ÷ 4`,a:-k,hint:'負數除以正數，結果是負的。',steps:[`總共付出記為 −${N}`,`${N} ÷ 4 = ${k}`,`負 ÷ 正 = 負，答案是 −${k}`]};},
  saving(){const A=hund(1,3),n=3+Math.floor(Math.random()*3),B=hund(2,9);return {text:`每天存 ${A} 元，連續存了 ${n} 天，最後買一本參考書花了 ${B} 元。這段時間的收支是多少？`,
    q:`(+${A}) × ${n} + (−${B})`,a:A*n-B,hint:'先算乘法，再算加法。',steps:[`先算乘法：${A} × ${n} = ${A*n}`,`再算加法：${A*n} + (−${B}) = ${sn(A*n-B)}`]};},
  stock(){const A=hund(2,8),B=hund(2,8),C=hund(2,8);return {text:`投資模擬遊戲：第一天賠 ${A} 元，第二天賺 ${B} 元，第三天又賠 ${C} 元。三天合計的收支是多少？`,
    q:`(−${A}) + (+${B}) + (−${C})`,a:B-A-C,hint:'由左往右兩個兩個加，注意正負號。',steps:[`先算：(−${A}) + ${B} = ${sn(B-A)}`,`再算：${sn(B-A)} + (−${C}) = ${sn(B-A-C)}`]};},
  phone(){const A=hund(5,9),B=hund(1,4);return {text:`手機摔壞了，修理費 ${A} 元，保險理賠 ${B} 元。這件事讓你的收支是多少？`,
    q:`(−${A}) + (+${B})`,a:B-A,hint:'異號相加：絕對值大的減小的，符號跟著絕對值大的。',steps:[`修理費記 −${A}，理賠記 +${B}`,`${A} − ${B} = ${A-B}`,`支出比較多，答案是 −${A-B}`]};},
  aircon(){const A=hund(1,3),n=2+Math.floor(Math.random()*4);return {text:`天氣太熱，冷氣每天多花 ${A} 元電費，連續開了 ${n} 天。用負數表示，總共的收支是多少？`,
    q:`(−${A}) × ${n}`,a:-A*n,hint:'負數乘以正數，結果是負的。',steps:[`每天記 −${A}`,`${A} × ${n} = ${A*n}`,`負 × 正 = 負，答案是 −${A*n}`]};},
  charity(){const d=200*(1+Math.floor(Math.random()*4)),B=hund(2,6),A=B+d;return {text:`班級義賣賺了 ${A} 元，扣掉材料費 ${B} 元後，賺到的錢和隔壁班平分。你們班分到多少？`,
    q:`[(+${A}) + (−${B})] ÷ 2`,a:d/2,hint:'先算中括號裡面，再算除法。',steps:[`先算括號：${A} + (−${B}) = ${d}`,`再算除法：${d} ÷ 2 = ${d/2}`]};},
  wallet(){const A=hund(5,9),B=hund(1,4);return {text:`錢包掉了，裡面有 ${A} 元（記為 −${A}）。後來找回一部分，等於減去了 ${B} 元的損失。最後的收支是多少？`,
    q:`(−${A}) − (−${B})`,a:B-A,hint:'減去一個數，等於加上它的相反數。',steps:[`(−${A}) − (−${B}) = (−${A}) + ${B}`,`${A} − ${B} = ${A-B}，絕對值大的是負數`,`答案是 −${A-B}`]};},
};

/* ---------------- toll maths ---------------- */
function tollCalc(sp,a,b,c){
  // 過路費 = 基本價 × (等級 + c − b)；算出負數代表店家倒貼顧客
  const x=a+c-b,toll=sp.base*x;
  const steps=[`${sp.base} × (${a} + ${par(c)} − ${par(b)})`,
    `先算括號：${a} + ${par(c)} − ${par(b)} = ${a+c} + ${par(-b)} = ${sn(x)}`,
    `再乘基本價：${sp.base} × ${par(x)} = ${sn(toll)}`];
  const note=toll>0?`顧客付給店家 ${fmtN(toll)} 元`:toll<0?`答案是負數：店家倒貼顧客 ${fmtN(-toll)} 元`:'答案是 0：不用付錢';
  return {steps,toll,note};
}
const formulaHTML=sp=>`${sp.base} × (a + c − b)`;
const rangeTxt=sp=>`基本價 ${fmtN(sp.base)}`;

/* ---------------- expression parsing (exact fractions) ---------------- */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const fr=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);return {n:n/g,d:d/g}};
function evalTokens(toks){
  let i=0;
  const peek=()=>toks[i];
  function factor(){const t=toks[i];
    if(!t) throw '算式還沒完成';
    if(t.t==='die'){i++;return fr(t.v);}
    if(t.t==='('){i++;const v=expr();if(!toks[i]||toks[i].t!==')') throw '括號沒有成對';i++;return v;}
    throw '算式的順序不對';}
  function term(){let v=factor();
    while(peek()&&peek().t==='op'&&(peek().v==='×'||peek().v==='÷')){const o=toks[i++].v;const w=factor();
      if(o==='×') v=fr(v.n*w.n,v.d*w.d); else {if(w.n===0) throw '不能除以 0';v=fr(v.n*w.d,v.d*w.n);}}
    return v;}
  function expr(){let v=term();
    while(peek()&&peek().t==='op'&&(peek().v==='+'||peek().v==='−')){const o=toks[i++].v;const w=term();
      v=o==='+'?fr(v.n*w.d+w.n*v.d,v.d*w.d):fr(v.n*w.d-w.n*v.d,v.d*w.d);}
    return v;}
  const v=expr();
  if(i<toks.length) throw toks[i].t===')'?'括號沒有成對':'算式的順序不對';
  return v;
}
const tokStr=t=>t.t==='die'?String(t.v):t.t==='op'?` ${t.v} `:t.t;

// ---- 題目：兩次機會。第一次錯給提示，第二次錯顯示解題步驟，遊戲照常繼續。
const STAT_SRC={turn:'每回合挑戰',shop:'商店',card:'機會命運',toll:'過路費',dice:'骰子算式',settle:'記帳結算'};
function statAdd(p,src,result){const s=p.stats[src]||(p.stats[src]={n:0,first:0,second:0,miss:0});s.n++;s[result]++;}
function curLevel(){
  if(G.cfg.level&&G.cfg.level!=='auto') return G.cfg.level;
  const pr=(G.day-1)/G.cfg.days;return pr<0.2?'add':pr<0.4?'sub':pr<0.5?'abs':pr<0.7?'md':'mix';
}
function drawQuestion(){
  const order=['add','sub','abs','md','mix'],L=curLevel(),used=new Set(G.used),li=order.indexOf(L);
  let pool=BANK.filter(q=>q.cat===L&&!used.has(q.id));
  for(let d=1;d<5&&!pool.length;d++) for(const k of [li-d,li+d]) if(!pool.length&&k>=0&&k<5) pool=BANK.filter(q=>q.cat===order[k]&&!used.has(q.id));
  if(!pool.length) pool=BANK.filter(q=>q.cat===L);
  const q=pool[Math.floor(Math.random()*pool.length)];G.used.push(q.id);return q;
}
function mathQ(p,q,o){
  // q: {q (算式) | qhtml, a, hint, steps, cat}; o: {title, pre, label, reward, src, after, next}
  return new Promise(res=>{
    let attempt=1;
    const head=`${whoHTML(p)}<h2>${o.title}</h2>${o.pre||''}`;
    const qbox=q.q?`<div class="qbox">${q.cat?`<span class="qcat">${CAT_NAME[q.cat]}</span>`:''}<div class="qq num">${q.q} = ?</div></div>`:(q.qhtml?`<div class="qbox">${q.qhtml}</div>`:'');
    const draw=hint=>{
      $('#stage').innerHTML=head+qbox+(hint||'')+`<div class="field"><label for="mqIn">${o.label||'答案'}${attempt===2?'・第二次機會':''}</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><input class="ans num" id="mqIn" autocomplete="off" placeholder="負數加負號，例如 −12" style="flex:1;min-width:8em;font-size:1.25em"><button class="btn main" id="mqOk">送出</button></div></div><div id="mqMsg" class="msgline"></div>`;
      const inp=$('#mqIn');try{inp.focus({preventScroll:true})}catch(e){}
      $('#mqOk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
    };
    const finish=result=>{
      statAdd(p,o.src,result);
      let gain=0;
      if(o.reward){gain=result==='first'?300:result==='second'?100:0;
        if(gain){record(p,`數學答對（${result==='first'?'第一次':'第二次'}）`,gain);p.mathGain+=gain;}}
      renderAll();
      const body=result==='miss'
        ?`<p class="neg"><b>兩次都沒答對。</b>看看解題步驟：</p><div class="calc">${(q.steps||[]).map(x=>`<div>${x}</div>`).join('')}<div class="res">答案：${sn(q.a)}</div></div><p class="sub">${o.reward?'這題沒有獎勵，':''}遊戲繼續。</p>`
        :`<p class="okline pos">答對了！${result==='second'?'（第二次）':''}</p>${gain?`<p>獲得答題獎勵 ${money(gain)} 元，記到記帳本。</p>`:''}${o.after||''}`;
      $('#stage').innerHTML=head+qbox+body+`<div class="btns"><button class="btn main" id="mqNext">${o.next||'繼續'}</button></div>`;
      $('#mqNext').onclick=()=>res(result);
    };
    function check(){
      const v=parseNum($('#mqIn').value);
      if(Number.isNaN(v)){$('#mqMsg').innerHTML='<span class="neg">請輸入整數，負數前面加負號，例如 −12。</span>';return;}
      if(v===q.a){finish(attempt===1?'first':'second');return;}
      if(attempt===1){attempt=2;draw(`<div class="hintbox"><b>提示</b>${q.hint||'再仔細算一次，注意正負號。'}</div>`);
        $('#mqMsg').innerHTML='<span class="neg">答錯了，看看提示，再試一次。</span>';return;}
      finish('miss');
    }
    draw();
  });
}
async function askNumber(p,title,body,answer,label='答案',opt={}){
  const r=await mathQ(p,{qhtml:opt.qhtml||'',a:answer,hint:opt.hint,steps:opt.steps||[`答案是 ${sn(answer)}`]},{title,pre:body,label,reward:false,src:opt.src||'card'});
  return r!=='miss';
}
const cardHTML=(c,k)=>`<div class="cardface c-${k}"><div class="ck">${{chance:'機會？',fate:'命運！',ability:'特異功能'}[k]}</div><div class="cn">${esc(c.n)}</div><div class="cd">${esc(c.d)}</div></div>`;

const signDie=(sg,extra='')=>`<div class="die sgn ${extra}" aria-label="${sg==null?'正負號骰子':sg>0?'正號':'負號'}">${sg==null?'±':sg>0?'＋':'－'}</div>`;
async function rollSign(p,r){
  $('#stage').innerHTML=`${whoHTML(p)}<h2>擲正負號骰子</h2><p>前進骰子算出 <b>${sn(r.v)}</b>。再擲正負號骰子（4 面＋、2 面－），決定往前還是往後。</p>
    <div class="tray" id="sgT" style="justify-content:flex-start;font-size:18px">${signDie(null)}</div><div class="btns"><button class="btn main" id="sgB">擲正負號骰子</button></div>`;
  await new Promise(res=>{$('#sgB').onclick=res});
  const sg=Math.random()<4/6?1:-1;
  if(!reduced()){for(let k=0;k<7;k++){$('#sgT').innerHTML=signDie(k%2?1:-1,'rolling');await sleep(70);}}
  $('#sgT').innerHTML=signDie(sg);
  const n=sg*r.v;
  G.tray={vals:r.vals,type:'move',expr:`${sg>0?'＋':'－'} 與 ${r.expr}`,v:n};renderAll();
  $('#stage .btns').innerHTML=`<p style="margin:0 0 8px">${sg>0?'正':'負'}號，${sg>0?'正':'負'} × ${sn(r.v)} 的${r.v<0?'（負負得正）':''}結果是 <b class="${cls(n)}">${sn(n)}</b>：${n>0?'往前':n<0?'往後':'不動'} ${Math.abs(n)} 步</p><button class="btn main" id="sgGo">${n>0?'往前走':n<0?'往後退':'原地不動'}</button>`;
  await new Promise(res=>{$('#sgGo').onclick=res});
  return sg;
}
async function rollExpr(p,type,title,body,manual){
  const level=p.lv[type],n=level;
  $('#stage').innerHTML=`${whoHTML(p)}<h2>${title}</h2>${body||''}
    <p class="sub">${DIE[type]}第 ${level} 級：${level===1?'骰一顆骰子。':level===2?'骰兩顆，可以加減，或只取其中一顆。':'骰三顆，可以四則運算（可加括號），或只取其中一顆。'}</p>
    <div class="tray" id="rt" style="justify-content:flex-start;font-size:18px">${Array.from({length:n},()=>dieHTML(null,type)).join('')}</div>
    <div class="btns"><button class="btn main" id="rb">${manual?'設定骰子點數':'擲骰子'}</button></div>`;
  await new Promise(r=>{$('#rb').onclick=r});
  let vals=Array.from({length:n},()=>rnd(6));
  if(manual){
    vals=vals.map(()=>6);
    const rt=$('#rt');
    const draw=()=>{rt.innerHTML=vals.map((v,i)=>`<div class="adj"><button data-a="${i}" data-d="1" aria-label="加一">▲</button>${dieHTML(v,type)}<button data-a="${i}" data-d="-1" aria-label="減一">▼</button></div>`).join('');};
    draw();
    $('#stage .btns').innerHTML=`<button class="btn main" id="rb2">就用這些點數</button>`;
    $('#stage').querySelector('.sub').insertAdjacentHTML('afterend','<p><b>在運動場裡，可操控收錢骰子：</b>自己決定每顆骰子的點數。</p>');
    rt.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.dataset.a;vals[i]=((vals[i]-1+(+b.dataset.d)+6)%6)+1;draw();};
    await new Promise(r=>{$('#rb2').onclick=r});
    rt.onclick=null;
  }else if(!reduced()){
    const rt=$('#rt');
    for(let k=0;k<7;k++){rt.innerHTML=vals.map(()=>dieHTML(rnd(6),type,'rolling')).join('');await sleep(65);}
  }
  $('#rt').innerHTML=vals.map(v=>dieHTML(v,type)).join('');
  if(n===1){
    G.tray={vals,type,expr:DIE[type],v:vals[0]};renderTray();
    $('#stage .btns').innerHTML=`<button class="btn main" id="rb3">點數是 ${vals[0]}，確定</button>`;
    await new Promise(r=>{$('#rb3').onclick=r});
    return {v:vals[0],expr:String(vals[0]),vals,type,stat:null};
  }
  // expression builder: students build the expression AND compute its value themselves
  const ops=level===2?['+','−']:['+','−','×','÷'];
  const toks=[];let wrong=0,locked=false;
  $('#stage .btns').remove();
  $('#rt').insertAdjacentHTML('afterend',`<div class="bld">
    <div class="row" id="bDice"></div>
    <div class="row">${ops.map(o=>`<button class="op" data-op="${o}">${o}</button>`).join('')}${level===3?'<button class="op" data-par="(">(</button><button class="op" data-par=")">)</button>':''}<button class="op" data-back="1" aria-label="退一格">⌫</button><button class="op" data-clr="1" style="font-size:.9em">清除</button></div>
    <div class="exprbox" id="bExpr"></div>
    <div class="row"><span class="num" style="font-size:1.3em;font-weight:600">=</span><input class="ans num" id="bAns" autocomplete="off" placeholder="自己算出答案" style="flex:1;min-width:7em;font-size:1.15em"></div>
    <div class="msg" id="bMsg"></div>
    <div class="btns" style="margin-top:0"><button class="btn main" id="bOk">確定</button><button class="btn main" id="bTeach" hidden>繼續</button></div></div>`);
  $('#rt').hidden=true;
  const setMsg=(m,err)=>{$('#bMsg').className='msg'+(err?' err':'');$('#bMsg').innerHTML=m;};
  const update=()=>{
    const used=new Set(toks.filter(t=>t.t==='die').map(t=>t.i));
    $('#bDice').innerHTML=vals.map((v,i)=>`<button class="diebtn" data-die="${i}" ${used.has(i)?'disabled':''} aria-label="骰子 ${v}">${dieHTML(v,type)}</button>`).join('')+
      `<span style="font-size:.85em;color:var(--ink-2)">點骰子放進算式</span>`;
    $('#bExpr').innerHTML=toks.length?toks.map(t=>`<span>${t.t==='die'?t.v:t.t==='op'?t.v:t.t}</span>`).join(''):'<span class="ph">例如：6 − 4　或　(5 + 3) ÷ 2　或只放一顆</span>';
    setMsg('',false);
  };
  const evalChecked=()=>{
    if(!toks.length) throw '先點骰子組出算式';
    const used=new Set(toks.filter(t=>t.t==='die').map(t=>t.i));
    const v=evalTokens(toks);
    if(used.size!==1&&used.size!==n) throw `要用全部 ${n} 顆骰子，或只取其中一顆`;
    if(v.d!==1) throw '這個算式算出來不是整數，換一個算式';
    return v.n;
  };
  update();
  return new Promise(res=>{
    const finish=(v,stat)=>{
      $('#stage').onclick=null;
      const expr=toks.map(tokStr).join('').replace(/\s+/g,' ').trim();
      G.tray={vals,type,expr,v};renderTray();
      res({v,expr,vals,type,stat});
    };
    $('#stage').onclick=e=>{
      const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.id==='bOk'||b.id==='bTeach'){
        let v;try{v=evalChecked();}catch(err){setMsg(typeof err==='string'?err:'算式的順序不對',true);return;}
        if(b.id==='bTeach'){finish(v,'miss');return;}
        const a=parseNum($('#bAns').value);
        if(Number.isNaN(a)){setMsg('在「=」後面填上你算出來的答案（負數加負號）',true);return;}
        if(a!==v){wrong++;
          if(wrong===1){setMsg('算錯了。提示：先算括號，再乘除，最後加減；注意正負號。再試一次。',true);return;}
          locked=true;setMsg(`還是不對，${esc(toks.map(tokStr).join('').replace(/\s+/g,' ').trim())} = <b>${sn(v)}</b>。`,true);
          $('#bOk').hidden=true;$('#bTeach').hidden=false;$('#bTeach').textContent=`用 ${sn(v)} 繼續`;return;}
        finish(v,wrong?'second':'first');return;
      }
      if(locked) return;
      if(b.dataset.die!=null){const i=+b.dataset.die;toks.push({t:'die',i,v:vals[i]});}
      else if(b.dataset.op){toks.push({t:'op',v:b.dataset.op});}
      else if(b.dataset.par){toks.push({t:b.dataset.par});}
      else if(b.dataset.back){toks.pop();}
      else if(b.dataset.clr){toks.length=0;}
      else return;
      update();
    };
    $('#bAns').onkeydown=e=>{if(e.key==='Enter')$('#bOk').click();};
  });
}

/* ---------------- turn engine ---------------- */
async function actionPrompt(p,title,mainLabel,body=''){
  for(;;){
    const usable=p.ab.filter(c=>!c.reactive);
    const v=await ask(p,title,body,[{label:mainLabel,v:'go',kind:'main'},
      {label:`使用特異功能卡（${p.ab.length}）`,v:'card',kind:'alt',disabled:!usable.length}]);
    if(v==='go') return;
    await useCardMenu(p);
    renderAll();
  }
}
async function useCardMenu(p){
  const v=await ask(p,'要使用哪一張特異功能卡？','<p class="sub">特異功能卡只能在自己的回合使用。</p>',
    [...p.ab.map((c,i)=>({label:esc(c.n),sub:esc(c.d),v:i,disabled:!!c.reactive})),{label:'先不用',v:-1,kind:'alt'}]);
  if(v===-1) return;
  const c=p.ab[v];
  const done=await applyAbility(p,c);
  if(done!==false){p.ab.splice(p.ab.indexOf(c),1);discard('ability',c);}
}
async function applyAbility(p,c){
  const all=G.players,nm=`【${c.n}】`;
  const pickAny=t=>pickPlayer(p,t);
  const fx={
    neg:q=>setMoney(q,0-q.money,`${nm}資產變相反數`),
    abs:q=>setMoney(q,Math.abs(q.money),`${nm}資產加上絕對值`),
    dbl:q=>setMoney(q,q.money*2,`${nm}資產變 2 倍`),
  };
  const opName={neg:'變成相反數',abs:'加上絕對值',dbl:'變成 2 倍'};
  const calcFx={neg:m=>(0-m)||0,abs:m=>Math.abs(m),dbl:m=>m*2};
  const transform=async(kind,targets)=>{for(const q of targets){const nv=calcFx[kind](q.money);
    await askNumber(p,`${nm}${esc(q.name)} 的資產${opName[kind]}`,`<p>${esc(q.name)} 現在的資產是 <b class="num">${fmtN(q.money)}</b> 元，${opName[kind]}之後是多少元？</p>`,nv,'新的資產（元）',{src:'card',hint:{neg:'相反數：正變負、負變正，0 還是 0。',abs:'絕對值是和 0 的距離，一定不是負數。',dbl:'乘以 2：負數乘 2 還是負數。'}[kind],steps:[`${opName[kind]}：${sn(q.money)} → ${sn(nv)}`]});
    setMoney(q,nv,`${nm}資產${opName[kind]}`);renderAll();}};
  const before=all.map(q=>q.money);
  const moneyReport=()=>all.map((q,i)=>q.money!==before[i]?`${esc(q.name)}：${fmtN(before[i])} → <b class="${cls(q.money)}">${fmtN(q.money)}</b>`:'').filter(Boolean).join('<br>')||'沒有人的資產改變（0 的相反數、絕對值、2 倍都還是 0）。';
  switch(c.id){
    case 'negAll':await transform('neg',all);break;
    case 'absAll':await transform('abs',all);break;
    case 'dblAll':await transform('dbl',all);break;
    case 'negOne':case 'absOne':case 'dblOne':{const t=await pickAny(`${c.n}：指定誰？`);await transform(c.id.slice(0,3),[all[t]]);break;}
    case 'goldAll':case 'brokeAll':{const L=c.id==='goldAll'?6:1;Object.values(G.shops).forEach(s=>s.level=L);
      log(`${esc(p.name)} 使用 ${nm}：所有店面變成 ${L} 級`);renderAll();await ok(p,`${c.n}！`,`<p>所有店面都變成 ${L} 級。</p>`);return;}
    case 'goldOne':case 'brokeOne':{const L=c.id==='goldOne'?6:1;const t=await pickAny(`${c.n}：指定誰？`);
      shopsOf(t).forEach(i=>G.shops[i].level=L);
      log(`${esc(p.name)} 使用 ${nm}：${esc(all[t].name)} 的店面都變成 ${L} 級`);renderAll();
      await ok(p,`${c.n}！`,`<p>${esc(all[t].name)} 的 ${shopsOf(t).length} 間店面都變成 ${L} 級。</p>`);return;}
    case 'busLib':case 'busSta':case 'busNet':{const t=await pickAny(`${c.n}：要接送誰？`);const q=all[t];
      q.zone=c.zone;q.pos=ZONE[c.zone].idx;
      log(`${esc(p.name)} 使用 ${nm}：${esc(q.name)} 直達${ZONE[c.zone].name}`);renderAll();
      await ok(p,`${esc(q.name)} 直達${ZONE[c.zone].name}`,`<p>${zoneRule(c.zone)}</p>`);return;}
    case 'swap':{
      const mine=shopsOf(pidx(p));
      if(!mine.length){await ok(p,'你還沒有商店','<p>乾坤大挪移要拿自己的一間商店去交換，等有商店再用吧。</p>','知道了');return false;}
      const others=all.map((q,i)=>i).filter(i=>i!==pidx(p)&&shopsOf(i).length);
      if(!others.length){await ok(p,'沒有人可以交換','<p>其他人都還沒有商店。</p>','知道了');return false;}
      const t=await pickPlayer(p,'乾坤大挪移：和誰交換？',(q,i)=>others.includes(i));
      const a=await pickShop(p,'拿出你的哪一間商店？',mine);
      const b=await pickShop(p,`換 ${esc(all[t].name)} 的哪一間商店？`,shopsOf(t));
      G.shops[a].owner=t;G.shops[b].owner=pidx(p);
      log(`${esc(p.name)} 使用 ${nm}：用 ${SPACES[a].name} 換 ${esc(all[t].name)} 的 ${SPACES[b].name}`);renderAll();
      await ok(p,'交換完成',`<p>${SPACES[a].name}（Lv.${G.shops[a].level}）↔ ${SPACES[b].name}（Lv.${G.shops[b].level}）</p>`);return;}
  }
  log(`${esc(p.name)} 使用 ${nm}`);renderAll();
  await ok(p,`${c.n}！`,`<p>${moneyReport()}</p>`);
}
function zoneRule(z){return {library:'在圖書館裡：每天可以抽 1 張特異功能卡、營業收入變 2 倍；骰到 4、5、6 才能離開。',
  netcafe:'在網咖裡：每天要付 1000 元、不能開店營業；骰到 1 才能離開。',
  stadium:'在運動場裡：每天可以領 3000 元獎勵、可操控收錢骰子；骰到 4、5、6 才能離開。'}[z];}

async function playTurn(){
  const p=P();
  G.tray=null;G.phase=1;renderAll();
  await mathQ(p,drawQuestion(),{title:'① 數學挑戰',pre:'<p class="sub">第一次答對 +300 元，第二次答對 +100 元。答錯也可以繼續玩。</p>',reward:true,src:'turn',next:'下一步：擲骰前進 →'});
  G.phase=2;renderAll();
  if(p.zone){const left=await zoneTurn(p);renderAll();if(!left){await endTurn(p);return;}}
  await actionPrompt(p,`② ${esc(p.name)} 擲骰前進`,'擲前進骰子',`<p>現在在 <b>${spaceName(p.pos)}</b>。</p>`);
  const r=await rollExpr(p,'move',`${esc(p.name)} 擲前進骰子`,'<p class="sub">算完後還要擲一顆正負號骰子，決定往前或往後。</p>');
  if(r.stat) statAdd(p,'dice',r.stat);
  const sg=await rollSign(p,r);
  await moveBy(p,sg*r.v,`(${sg>0?'+':MINUS}1) × ${par(r.v)}`);
  G.phase=3;
  await resolveSpace(p);
  renderAll();
  await endTurn(p);
}
const spaceName=i=>{const s=SPACES[i];return s.t==='shop'?`${s.kind}・${s.name}`:s.name||{chance:'機會',fate:'命運',school:'學校',gambler:'遇到賭聖'}[s.t];};
async function endTurn(p){
  const last=G.turn===G.players.length-1;G.phase=4;
  await actionPrompt(p,`④ ${esc(p.name)} 的回合結束`,last?`結束第 ${G.day} 天 →`:`換 ${esc(G.players[G.turn+1].name)} →`,'<p>把這回合的答題獎勵和收支寫進記帳本，然後換下一組。</p>');
}
async function zoneTurn(p){
  const z=p.zone,zn=ZONE[z].name;
  if(z==='netcafe'){
    record(p,'網咖每天付 1000 元',-1000);log(`${esc(p.name)} 在網咖，付 1000 元`);renderAll();
    const fi=p.cp.findIndex(c=>c.id==='family');
    if(fi>=0){const u=await ask(p,'你在網咖',`<p>今天付了 1000 元。你有「家人來電」卡，可以直接離開網咖。</p>`,[{label:'使用家人來電，離開網咖',v:1,kind:'main'},{label:'先保留，用骰的',v:0,kind:'alt'}]);
      if(u){const c=p.cp.splice(fi,1)[0];discard('fate',c);p.zone=null;log(`${esc(p.name)} 用「家人來電」離開網咖`);renderAll();return true;}}
    await actionPrompt(p,`${esc(p.name)} 在網咖`,'擲骰看能不能離開',`<p>今天付了 1000 元。骰到 <b>1</b> 才能離開網咖。</p>`);
    const v=await rollD6(p,'骰到 1 才能離開網咖');

  }
  let body;
  if(z==='library'){const c=draw('ability');p.ab.push(c);log(`${esc(p.name)} 在圖書館抽到特異功能卡「${esc(c.n)}」`);renderAll();

  else{record(p,'運動場每天獎勵 3000 元',3000);log(`${esc(p.name)} 在運動場，領 3000 元`);renderAll();
    body=`<p>今天在運動場領到 ${money(3000)} 元獎勵。骰到 4、5、6 會離開運動場。</p>`;}
  await actionPrompt(p,`${esc(p.name)} 在${zn}`,'擲骰看能不能離開',body);
  const v=await rollD6(p,`骰到 4、5、6 會離開${zn}`);

  log(`${esc(p.name)} 骰到 ${v}，留在${zn}`);await ok(p,`骰到 ${v}，留在${zn}`,'<p>這回合結束。</p>');return false;
}
async function moveBy(p,n,expr){
  if(n===0){log(`${esc(p.name)} 算出 0，原地不動`);return;}
  const steps=Math.abs(n),dir=Math.sign(n);let passes=0;
  const delay=reduced()?0:Math.max(10,Math.min(170,2200/steps));
  for(let s=0;s<steps;s++){
    p.pos=(p.pos+dir+N)%N;
    if(dir>0&&p.pos===0&&s<steps-1) passes++;
    if(delay){renderBoard();if(running)schedulePush();await sleep(delay);}
  }
  renderBoard();
  log(`${esc(p.name)} ${esc(expr)} = ${n<0?MINUS+steps:n}，${n>0?'前進':'後退'} ${steps} 步到 ${spaceName(p.pos)}`);
  if(passes){const v=passes*G.cfg.pass;record(p,`經過起點${passes>1?` ${passes} 次`:''}，車馬費`,v);
    log(`${esc(p.name)} 經過起點${passes>1?` ${passes} 次`:''}，得 ${fmtN(v)} 元`);renderAll();
    await ok(p,`經過起點${passes>1?` ${passes} 次`:''}！`,`<p>得到車馬費 ${money(v)} 元。</p>`);}
}

      await ok(p,'停在起點',`<p>要付住宿費 ${money(-G.cfg.stay)} 元。</p>`);break;

async function payToll(p,i){
  const sp=SPACES[i],sh=G.shops[i],o=G.players[sh.owner];
  if(o.zone==='netcafe'){log(`${esc(p.name)} 到「${sp.name}」，${esc(o.name)} 在網咖沒開店，免付`);
    await ok(p,`${esc(o.name)} 在網咖，沒開店`,'<p>在網咖裡不能開店營業，這次免付過路費。</p>');return;}
  const opts=[];
  p.cp.forEach((c,k)=>{if(c.kind===sp.kind) opts.push({label:`使用「${c.n}」`,sub:c.d,v:{src:'cp',c}});});
  const inv=p.ab.find(c=>c.id==='invis');if(inv) opts.push({label:'使用「你看不到我」',sub:'免付過路費',v:{src:'ab',c:inv}});
  if(opts.length){
    const u=await ask(p,`走到 ${esc(o.name)} 的「${sp.name}」`,'<p>你有可以免付過路費的卡片，要用嗎？</p>',[...opts,{label:'不用，照常付費',v:null,kind:'alt'}]);
    if(u){const arr=u.src==='cp'?p.cp:p.ab;arr.splice(arr.indexOf(u.c),1);discard(u.src==='cp'?'fate':'ability',u.c);
      log(`${esc(p.name)} 用「${esc(u.c.n)}」免付「${sp.name}」過路費`);renderAll();
      await ok(p,'免付過路費！',`<p>用掉了「${esc(u.c.n)}」。</p>`);return;}
  }
  const head=`<p>過路費 = <span class="num">${formulaHTML(sp)}</span><br><span class="sub">a = 店面等級（${sh.level}）、b = 顧客點數、c = 主人點數</span></p>`;
  const b=await rollExpr(p,'pay',`付過路費：${esc(p.name)} 擲付錢骰子`,head+'<p class="sub">b 越小，付得越少。</p>');
  if(b.stat) statAdd(p,'dice',b.stat);
  const c=await asSeat(sh.owner,'rollExpr',[sh.owner,'collect',`收過路費：主人 ${esc(o.name)} 擲收錢骰子`,head+`<p>${esc(p.name)} 算出 b = <b>${par(b.v)}</b>。c 越大，收得越多。</p>`,o.zone==='stadium']);
  if(c.stat) statAdd(o,'dice',c.stat);
  G.tray={vals:c.vals,type:'collect',expr:c.expr,v:c.v};renderAll();
  const r=tollCalc(sp,sh.level,b.v,c.v);
  const given=`<div class="calc"><div class="lab">a = ${sh.level}，b = ${par(b.v)}，c = ${par(c.v)}</div><div>過路費 = ${formulaHTML(sp)}</div><div>代入：${r.steps[0]}</div></div><p class="sub">先算括號，再乘基本價。算出負數代表店家要倒貼你。</p>`;
  const right=await askNumber(p,'過路費是多少元？',given,r.toll,'過路費（元）',{src:'toll',hint:'先算括號：等級 + c − b。減去一個負數等於加上正數。再乘以基本價，注意正負號。',steps:[...r.steps,r.note]});
  let toll=r.toll,extra='';
  if(o.zone==='library'){
    await askNumber(p,`${esc(o.name)} 在圖書館，營業收入變 2 倍`,`<p>過路費是 ${fmtN(r.toll)} 元，變成 2 倍是多少元？</p>`,r.toll*2,'實際過路費（元）',{src:'toll',steps:[`${fmtN(r.toll)} × 2 = ${fmtN(r.toll*2)}`]});
    toll*=2;extra=`<div>${esc(o.name)} 在圖書館，營業收入變 2 倍：${fmtN(r.toll)} × 2 = ${fmtN(toll)}</div>`;}
  record(p,toll>=0?`付過路費給${o.name}（${sp.name}）`:`${o.name}的${sp.name}倒貼`,-toll);
  record(o,toll>=0?`收過路費（${sp.name}，${p.name}付）`:`${sp.name}倒貼給${p.name}`,toll);
  log(toll>=0?`${esc(p.name)} 付給 ${esc(o.name)}「${sp.name}」過路費 ${fmtN(toll)} 元`:`${esc(o.name)} 的「${sp.name}」倒貼 ${esc(p.name)} ${fmtN(-toll)} 元`);renderAll();
  await ok(p,`${right?'算對了！':''}過路費 ${sn(toll)} 元`,`<div class="calc"><div class="lab">計算過程</div><div>a = ${sh.level}，b = ${par(b.v)}，c = ${par(c.v)}</div>${r.steps.map(x=>`<div>${x}</div>`).join('')}<div class="lab">${r.note}</div>${extra}</div><p class="sub">${esc(p.name)} 和 ${esc(o.name)} 都要記到記帳本裡。</p>`);
}

      await ok(p,'上學一天',`<p>骰子都已經滿級，得到 ${money(sp.bonus)} 元。</p>`);return;}

    p.lv[t]++;log(`${esc(p.name)} 的${DIE[t]}升到 ${p.lv[t]} 級`);renderAll();

async function doChance(p){
  const c=draw('chance');discard('chance',c);
  log(`${esc(p.name)} 抽到機會卡「${esc(c.n)}」`);
  if(c.math){await doSituation(p,c,'chance');return;}
  const card=cardHTML(c,'chance');
  const types=['move','pay','collect'];
  const others=(q,i)=>q!==p;
  switch(c.id){
    case 'lotto':case 'scam':case 'invoice':case 'invest':{
      const mult={lotto:1000,scam:-100,invoice:100,invest:-1000}[c.id];
      await ok(p,`機會：${c.n}`,card,'擲骰決定 a');
      const a=await rollD6(p,`${c.n}：a = ?`,card);
      const v=mult*a;
      await askNumber(p,`${c.n}：${mult>0?'獲得':'損失'}多少元？`,`<div class="calc">${Math.abs(mult)} × a，a = ${a}</div>`,Math.abs(v),`${mult>0?'獲得':'損失'}（元）`,{src:'card',steps:[`${Math.abs(mult)} × ${a} = ${Math.abs(v)}`]});
      record(p,c.n,v);log(`${esc(p.name)} ${c.n}：${Math.abs(mult)} × ${a} = ${fmtN(Math.abs(v))}`);renderAll();return;}
    case 'teacher':{
      const can=types.filter(t=>p.lv[t]<3);
      const v=await ask(p,`機會：${c.n}`,card,[...can.map(t=>({label:`${DIE[t]}升一級`,sub:`第 ${p.lv[t]} → ${p.lv[t]+1} 級`,v:t})),{label:'得到 1000 元',v:'m'}]);
      if(v==='m'){record(p,c.n,1000);}else{p.lv[v]++;}
      log(`${esc(p.name)} 選擇${v==='m'?'得到 1000 元':DIE[v]+'升級'}`);renderAll();return;}
    case 'skip':{
      const can=types.filter(t=>p.lv[t]>1);
      const v=await ask(p,`機會：${c.n}`,card,[...can.map(t=>({label:`${DIE[t]}降一級`,sub:`第 ${p.lv[t]} → ${p.lv[t]-1} 級`,v:t})),{label:'損失 1000 元',v:'m'}]);
      if(v==='m'){record(p,c.n,-1000);}else{p.lv[v]--;}
      log(`${esc(p.name)} 選擇${v==='m'?'損失 1000 元':DIE[v]+'降級'}`);renderAll();return;}
    case 'lightning':{
      const v=await ask(p,`機會：${c.n}`,card,[{label:'抽一張特異功能卡',v:'c'},{label:'得到 3000 元',v:'m'}]);
      if(v==='m'){record(p,c.n,3000);log(`${esc(p.name)} 選擇 3000 元`);renderAll();return;}
      const k=draw('ability');p.ab.push(k);log(`${esc(p.name)} 抽到「${esc(k.n)}」`);renderAll();
      await ok(p,'抽到特異功能卡',cardHTML(k,'ability'));return;}
    case 'curse':{
      if(!p.ab.length){record(p,c.n,-3000);log(`${esc(p.name)} 沒有特異功能卡，損失 3000 元`);renderAll();
        await ok(p,`機會：${c.n}`,card+`<p>你沒有特異功能卡，只好損失 ${money(-3000)} 元。</p>`);return;}
      const v=await ask(p,`機會：${c.n}`,card,[...p.ab.map((k,i)=>({label:`丟掉「${esc(k.n)}」`,v:i})),{label:'損失 3000 元',v:'m'}]);
      if(v==='m'){record(p,c.n,-3000);log(`${esc(p.name)} 損失 3000 元`);}
      else{const k=p.ab.splice(v,1)[0];discard('ability',k);log(`${esc(p.name)} 丟掉「${esc(k.n)}」`);}
      renderAll();return;}
    case 'robbed':case 'rob':{
      const robbed=c.id==='robbed';
      const ti=await pickPlayer(p,robbed?`${c.n}：被誰抽走？`:`${c.n}：要抽誰的？`,others,card+(robbed?'<p class="sub">由大家決定哪一位當流氓。</p>':''));
      const thief=robbed?G.players[ti]:p,victim=robbed?p:G.players[ti];
      let v='m';
      if(victim.ab.length){v=await asSeat(pidx(thief),'ask',[pidx(thief),`${esc(thief.name)} 要拿什麼？`,`<p>${esc(victim.name)} 有 ${victim.ab.length} 張特異功能卡（看不到內容，隨機抽一張）。</p>`,
        [{label:'抽走一張特異功能卡',v:'c'},{label:'拿走 3000 元',v:'m'}]]);}
      if(v==='m'){record(victim,`${c.n}（被${thief.name}拿走）`,-3000);record(thief,`${c.n}（拿${victim.name}的）`,3000);
        log(`${esc(thief.name)} 拿走 ${esc(victim.name)} 3000 元`);renderAll();
        await ok(p,`${esc(thief.name)} 拿走 ${esc(victim.name)} 3000 元`,`<p>${esc(victim.name)} ${money(-3000)}　${esc(thief.name)} ${money(3000)}</p>`);}
      else{const k=victim.ab.splice(Math.floor(Math.random()*victim.ab.length),1)[0];thief.ab.push(k);
        log(`${esc(thief.name)} 抽走 ${esc(victim.name)} 一張特異功能卡`);renderAll();
        await ok(p,`${esc(thief.name)} 抽走一張特異功能卡`,cardHTML(k,'ability'));}
      return;}
  }
}

function makeLocalDB(){
  // 本機測試：資料拆成很多小格（最多 4 層路徑一格）存在 localStorage，分頁之間用 BroadcastChannel 通知。
  const PFX='pmdb|',DEPTH=4;
  const parts=p=>p.split('/').filter(Boolean);
  const keys=()=>{const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PFX))out.push(k.slice(PFX.length));}}catch(e){}return out;};
  const rd=b=>{try{const v=localStorage.getItem(PFX+b);return v==null?undefined:JSON.parse(v)}catch(e){return undefined}};
  const wr=(b,v)=>{try{if(v===undefined||v===null)localStorage.removeItem(PFX+b);else localStorage.setItem(PFX+b,JSON.stringify(v))}catch(e){}};
  function getAt(p){const ps=parts(p);
    if(ps.length>=DEPTH){let v=rd(ps.slice(0,DEPTH).join('/'));for(const k of ps.slice(DEPTH)){if(v==null)return undefined;v=v[k];}return v;}
    const own=rd(ps.join('/'));if(own!==undefined)return own;
    const pre=ps.join('/')+'/';let obj;
    for(const b of keys()){if(!b.startsWith(pre))continue;const rest=b.slice(pre.length).split('/');obj=obj||{};let o=obj;
      for(let i=0;i<rest.length-1;i++){o[rest[i]]=o[rest[i]]&&typeof o[rest[i]]==='object'?o[rest[i]]:{};o=o[rest[i]];}o[rest[rest.length-1]]=rd(b);}
    return obj;}
  function setAt(p,v){const ps=parts(p);
    if(ps.length>DEPTH){const b=ps.slice(0,DEPTH).join('/');let root=rd(b);if(root==null||typeof root!=='object')root={};let o=root;const rest=ps.slice(DEPTH);
      for(let i=0;i<rest.length-1;i++){if(o[rest[i]]==null||typeof o[rest[i]]!=='object')o[rest[i]]={};o=o[rest[i]];}
      if(v==null)delete o[rest[rest.length-1]];else o[rest[rest.length-1]]=JSON.parse(JSON.stringify(v));wr(b,root);return;}
    const base=ps.join('/');
    for(const b of keys()) if(b===base||b.startsWith(base+'/')) wr(b,null);
    for(let i=1;i<ps.length;i++) if(rd(ps.slice(0,i).join('/'))!==undefined) wr(ps.slice(0,i).join('/'),null);
    const put=(path,val,depth)=>{if(val==null)return;if(depth<DEPTH&&typeof val==='object'&&!Array.isArray(val)){for(const k in val)put(path+'/'+k,val[k],depth+1);}else wr(path,val);};
    put(base,v,ps.length);}
  const subs=new Set();
  function notify(){for(const s of [...subs]){const v=getAt(s.path);const j=JSON.stringify(v??null);if(j!==s.last){s.last=j;try{s.cb(v??null)}catch(e){console.error(e)}}}}
  let bc=null;try{bc=new BroadcastChannel('pmdb');bc.onmessage=()=>notify();}catch(e){}
  window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith(PFX))notify();});
  setInterval(notify,1500);
  const changed=()=>{try{bc&&bc.postMessage(1)}catch(e){}setTimeout(notify,0);};
  return {local:true,
    async get(p){return getAt(p)??null},
    async set(p,v){setAt(p,v);changed()},
    async update(p,o){for(const k in o)setAt(p+'/'+k,o[k]);changed()},
    async remove(p){setAt(p,null);changed()},
    async txn(p,fn){const real=getAt(p)??null;if(real!==null&&fn(null)===undefined)return {committed:false,value:real};
      const nv=fn(real==null?null:JSON.parse(JSON.stringify(real)));if(nv===undefined)return {committed:false,value:real};setAt(p,nv);changed();return {committed:true,value:nv}},
    on(p,cb){const s={path:p,cb,last:undefined};subs.add(s);setTimeout(()=>{if(!subs.has(s))return;const v=getAt(p);s.last=JSON.stringify(v??null);cb(v??null)},0);return ()=>subs.delete(s)},
  };
}
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});}
async function makeFirebaseDB(){
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.database(),r=p=>db.ref(p);
  return {local:false,
    async get(p){return (await r(p).get()).val()},
    set:(p,v)=>r(p).set(v),update:(p,o)=>r(p).update(o),remove:p=>r(p).remove(),
    async txn(p,fn){const x=await r(p).transaction(cur=>fn(cur));return {committed:x.committed,value:x.snapshot.val()}},
    on(p,cb){const h=sn=>cb(sn.val());r(p).on('value',h);return ()=>r(p).off('value',h)},
  };
}

async function handleReqs(reqs){
  for(const id of Object.keys(reqs)){

    try{const v=await LOCAL[q.kind](...JSON.parse(q.args));await DB.set(rp('resp/'+id),JSON.stringify(v));}
    catch(e){console.error(e);}
    finally{responding--;}
    afterSync();
  }
}

function afterSync(){
  if(NET.code&&!G){showLobby();return;}
  if(!G||!NET.code) return;
  if(G.over){
    $('#stage').innerHTML=`<h2>遊戲結束</h2><p>${G.cfg.days} 天過去了，看看誰是大富翁、誰是「負」翁。</p><div class="btns"><button class="btn main" id="goRank">看排名與答題紀錄</button></div>`;
    $('#goRank').onclick=showFinal;
    if(!NET.finalShown){NET.finalShown=true;showFinal();}
    return;
  }
  if(!running&&!responding&&NET.meta&&NET.meta.status==='playing'&&mine(G.turn)) runTurnStep();
  else showSpectator();
}
async function runTurnStep(){
  running=true;const tok=++runToken;
  try{
    const key=`${G.day}-${G.turn}`;NET.runSeat=G.turn;
    const ck=await DB.get(rp('ck'));
    if(ck&&JSON.parse(ck).key===key) G=JSON.parse(ck).g;
    else await DB.set(rp('ck'),JSON.stringify({key,g:G}));
    await DB.remove(rp('req'));await DB.remove(rp('resp'));
    if(tok!==runToken) return;
    (G.turnStart||(G.turnStart={}))[key]=Date.now();
    renderAll();
    await playTurn();
    if(tok!==runToken) return;
    if(G.turn===G.players.length-1){
      G.phase=0;
      await endOfDayAll();
      if(tok!==runToken) return;
      G.day++;G.turn=0;G.tray=null;
      if(G.day>G.cfg.days){G.day=G.cfg.days;G.over=true;log('遊戲結束！');}
      else log(`—— 第 ${G.day} 天開始 ——`);
    }else G.turn++;
    G.phase=0;
    await pushNow();
    if(G.over) await DB.update(rp('meta'),{status:'over'});
  }catch(e){if(e!==ABORT) console.error(e);}
  finally{if(tok===runToken){running=false;afterSync();}}
}

async function joinRoom(code,name,seatPick){
  NET.code=code;
  const meta=await DB.get(rp('meta'));
  if(!meta){NET.code=null;return `找不到第 ${code} 桌，請確認房號。`;}
  const seats=(await DB.get(rp('seats')))||{};
  const keys=Object.keys(seats).filter(k=>seats[k]);
  const norm=x=>String(x||'').replace(/\s+/g,'');
  let k=seatPick!=null?String(seatPick):keys.find(k=>norm(seats[k].name)===norm(name));
  if(k==null){
    if(meta.status!=='lobby'){
      NET.code=null;
      if(!keys.length) return '這一桌已經開始了。';
      pickSeat(code,keys.map(k=>({k,name:seats[k].name})));return true;
    }
    if(keys.length>=6){NET.code=null;return '這一桌已經坐滿 6 人了。';}
    // 新座位：用交易避免兩個人同時搶到同一個位子（第一次可能拿到空資料，Firebase 會用真的資料重跑）
    const res=await DB.txn(rp('seats'),cur=>{
      cur=cur?{...cur}:{};const ks=Object.keys(cur).filter(x=>cur[x]);
      if(ks.some(x=>norm(cur[x].name)===norm(name))) return cur;
      if(ks.length>=6) return;
      cur[ks.length]={name,dev:DEV,ctrl:DEV};return cur;
    });
    const after=(await DB.get(rp('seats')))||{};
    k=Object.keys(after).find(x=>after[x]&&norm(after[x].name)===norm(name));
    if(k==null){NET.code=null;return res.committed?'加入失敗，請再試一次。':'這一桌已經坐滿 6 人了。';}
    if(after[k].dev===DEV){NET.code=null;finishJoin(code,after[k].name);return true;}
  }
  // 回到原本的座位（重新整理、跳出、換裝置都可以）；老師接手中就維持老師操作
  const s=(await DB.get(rp('seats/'+k)))||{};
  const teacherHas=s.ctrl&&s.dev&&s.ctrl!==s.dev;
  await DB.update(rp('seats/'+k),{dev:DEV,ctrl:teacherHas?s.ctrl:DEV});
  NET.code=null;
  finishJoin(code,s.name||name);
  return true;
}

async function delRoom(code){
  const T=ls.get('pmTeacher')||{rooms:[]};
  modal(`<h2>刪除第 ${code} 桌？</h2><p>這一桌的遊戲進度會被清除，學生的畫面也會關閉。</p><div class="btns"><button class="btn main" id="dY">刪除</button><button class="btn alt" id="dN">取消</button></div>`,true);
  $('#dN').onclick=closeModal;
  $('#dY').onclick=async()=>{closeModal();await DB.remove(`${ROOT}/${PREFIX}${code}`);T.rooms=T.rooms.filter(c=>c!==code);ls.set('pmTeacher',T);openDashboard();};
}
function classStats(){
  const T=ls.get('pmTeacher')||{rooms:[]};const srcs=Object.keys(STAT_SRC);const rows=[];const tot={n:0,first:0,second:0,miss:0};
  T.rooms.forEach(code=>{const d=DASH.data[code];if(!d||!d.state)return;const g=JSON.parse(d.state);
    g.players.forEach(p=>{const sc=mathScore(p);let sec=0,miss=0;Object.values(p.stats||{}).forEach(s=>{sec+=s.second;miss+=s.miss;tot.n+=s.n;tot.first+=s.first;tot.second+=s.second;tot.miss+=s.miss;});
      rows.push(`<tr><td>${code}</td><td>${esc(p.name)}</td>${srcs.map(k=>`<td class="n">${p.stats&&p.stats[k]?p.stats[k].n:0}</td>`).join('')}<td class="n"><b>${sc.n}</b></td><td class="n">${sc.first}</td><td class="n">${sec}</td><td class="n">${miss}</td><td class="n">${fmtN(p.mathGain||0)}</td></tr>`);});});
  modal(`<h2>全班答題統計</h2><p class="sub">各來源的題數；「骰子算式」與「記帳結算」另外列出。合計 ${tot.n} 題，一次答對 ${tot.first}、二次答對 ${tot.second}、沒答對 ${tot.miss}。</p>
    <div class="tblwrap"><table class="ledger stats"><thead><tr><th>桌</th><th>組別</th>${srcs.map(k=>`<th>${STAT_SRC[k]}</th>`).join('')}<th>合計</th><th>一次答對</th><th>二次答對</th><th>沒答對</th><th>答題獎金</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="13">還沒有資料</td></tr>'}</tbody></table></div>
    <div class="btns"><button class="btn main" id="mClose">關閉</button></div>`);
  $('#mClose').onclick=closeModal;
}

async function start(){
  buildBoard();
  $('#stage').innerHTML='<h2>載入中…</h2>';
  await initDB();
  const j=ss.get('pmJoin');
  if(j&&(await joinRoom(j.code,j.name))===true) return;
  const q=new URLSearchParams(location.search).get('room');
  if(q){joinForm(q);return;}
  const last=ls.get('pmLast');
  if(last&&Date.now()-last.t<6*3600e3){joinForm(last.code,'',true);return;}
  goHome();
}
start();
