<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>正負數乘除 100 題</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a number-line strip on top, level picker, then one big question card with an on-screen keypad (tablet first). */
:root{
  --paper:#f1f5f3; --card:#ffffff; --card-2:#f5f8f7; --ink:#1b2729; --ink-2:#56666a; --line:#d3ddda;
  --pos:#1d63a8; --neg:#cc3a26; --ok:#2e8a4e; --accent:#e39a12; --accent-ink:#2a1c00;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111a1b; --card:#1b2627; --card-2:#162021; --ink:#e6eeec; --ink-2:#a2b2b4; --line:#2f3d3f;
  --pos:#6cb2f5; --neg:#ff7a63; --ok:#5fc27f; --accent:#f2b23a; --accent-ink:#241700; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a1b; --card:#1b2627; --card-2:#162021; --ink:#e6eeec; --ink-2:#a2b2b4; --line:#2f3d3f;
  --pos:#6cb2f5; --neg:#ff7a63; --ok:#5fc27f; --accent:#f2b23a; --accent-ink:#241700; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .okc{color:var(--ok)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:2em;line-height:1.1;margin:0;letter-spacing:.03em}
h1 .m{color:var(--neg)} h1 .p{color:var(--pos)}
.who{display:flex;align-items:center;gap:6px;font-size:.9em;color:var(--ink-2)}
.who input{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:.25em .5em;background:var(--card);color:var(--ink);width:8em}
.nl{height:30px;position:relative;margin:2px 4px 0}
.nl svg{width:100%;height:30px;display:block}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lvl{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.lvl b{font-family:var(--f-display);font-size:1.15em}
.lvl span{font-size:.78em;color:var(--ink-2);line-height:1.3}
.lvl .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.lvl .bar i{display:block;height:100%;background:var(--ok)}
.lvl.on{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px -16px rgba(20,50,50,.45)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.dots button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--card-2);font-family:var(--f-num);font-size:.72em;padding:0;color:var(--ink-2)}
.dots button.cur{border-color:var(--ink);color:var(--ink);font-weight:600}
.dots button.first{background:var(--ok);border-color:var(--ok);color:#fff}
.dots button.second{background:color-mix(in srgb,var(--ok) 35%,var(--card));border-color:var(--ok);color:var(--ink)}
.dots button.miss{background:color-mix(in srgb,var(--neg) 25%,var(--card));border-color:var(--neg);color:var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--ink-2);font-size:.9em}
.q{font-family:var(--f-num);font-weight:600;font-size:clamp(1.7em,6.4vw,2.6em);line-height:1.25;margin:14px 0 10px;overflow-wrap:anywhere}
.ansrow{display:flex;align-items:center;gap:10px;font-family:var(--f-num);font-size:clamp(1.5em,5.5vw,2.1em);font-weight:600}
.ans{flex:1;min-width:0;min-height:1.6em;border:2.5px solid var(--ink);border-radius:12px;padding:.1em .45em;background:var(--card-2);display:flex;align-items:center}
.ans .ph{font-family:var(--f-body);font-size:.5em;font-weight:400;color:var(--ink-2)}
.ans.wrong{border-color:var(--neg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{min-height:1.5em;margin:10px 0 2px;font-weight:700}
.hint{border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);padding:8px 12px;border-radius:0 10px 10px 0;margin:8px 0}
.hint b{display:block;font-size:.8em;letter-spacing:.1em}
.steps{background:var(--card-2);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:.98em}
.steps ol{margin:4px 0;padding-left:1.4em}
.steps .fin{font-family:var(--f-num);font-weight:600;font-size:1.2em}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pad button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);font-family:var(--f-num);font-size:1.45em;font-weight:600}
.pad button:active{transform:translateY(1px)}
.pad .neg-k{color:var(--neg);font-size:1.1em}
.pad .go{grid-column:4;grid-row:3/5;background:var(--ink);color:var(--card);border-color:var(--ink);font-family:var(--f-body);font-size:1.15em}
.pad .wide{grid-column:span 2}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:.55em 1.1em;font-weight:700}
.btn.main{background:var(--ink);color:var(--card)}
.btn.alt{border-color:var(--line);font-weight:500}
.result h2{font-family:var(--f-display);font-size:1.8em;margin:0 0 4px}
.score{font-family:var(--f-num);font-size:3em;font-weight:600;line-height:1}
.score small{font-size:.35em;color:var(--ink-2)}
.stars{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-size:.95em}
.misslist{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.misslist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px;font-family:var(--f-num)}
.foot{font-size:.82em;color:var(--ink-2);text-align:center}
@media (max-width:560px){
  .levels{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .lvl{padding:6px 5px 8px;border-radius:10px}
  .lvl span{display:none}
  .card{padding:14px}
  .dots button{width:22px;height:22px}
}
@media (prefers-reduced-motion:reduce){.ans.wrong{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="p">正</span><span class="m">負</span>數乘除 100 題</h1>
    <label class="who" for="nm">名字 <input id="nm" maxlength="10" placeholder="寫上名字" autocomplete="off"></label>
  </header>
  <div class="nl" aria-hidden="true"><svg viewBox="0 0 700 30" preserveAspectRatio="none" id="nlsvg"></svg></div>
  <nav class="levels" id="levels" aria-label="選擇關卡"></nav>
  <main class="card" id="main"></main>
  <p class="foot">每題有兩次機會：答錯一次會出現提示，再錯就看解題步驟。紀錄存在這台裝置上。</p>
</div>

const M='−';

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='pmMD100.v1';
let S=load();
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.MathSync)MathSync.push(KEY);}
// state for the current question
let cur=null,typed='',tries=0,done=false;

function drawNumberLine(){
  let g='<line x1="10" y1="15" x2="690" y2="15" stroke="currentColor" stroke-width="1.5" opacity=".45"/>';
  for(let i=-10;i<=10;i++){const x=350+i*33;g+=`<line x1="${x}" y1="${i===0?6:10}" x2="${x}" y2="${i===0?24:20}" stroke="${i<0?'var(--neg)':i>0?'var(--pos)':'currentColor'}" stroke-width="${i===0?2.5:1.5}"/>`;}
  g+='<text x="350" y="30" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">0</text>';
  $('#nlsvg').innerHTML=g;$('#nlsvg').style.color='var(--ink)';
}
function lvQs(lv){return DATA.qs.map((q,i)=>({...q,i})).filter(q=>q.lv===lv);}
function lvStat(lv){const r=lvQs(lv).map(q=>S.res[q.i]);return {done:r.filter(Boolean).length,first:r.filter(x=>x==='first').length,second:r.filter(x=>x==='second').length,miss:r.filter(x=>x==='miss').length};}
function renderLevels(){
  $('#levels').innerHTML=LV.map((l,k)=>{const st=lvStat(k+1);const pct=st.done/20*100;
    return `<button class="lvl ${S.lv===k+1?'on':''}" data-lv="${k+1}" aria-pressed="${S.lv===k+1}"><b>${l.name}</b><span>${l.sub}</span><span class="num">${st.done}/20</span><div class="bar"><i style="width:${pct}%"></i></div></button>`;}).join('');
  $('#levels').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{S.lv=+b.dataset.lv;save();openLevel();});
}
function openLevel(){
  renderLevels();
  const qs=lvQs(S.lv);const next=qs.find(q=>!S.res[q.i]);
  if(next) show(next.i); else result();
}
function dotsHTML(){
  return `<div class="dots" role="list">${lvQs(S.lv).map(q=>`<button role="listitem" data-q="${q.i}" class="${S.res[q.i]||''} ${cur&&cur.i===q.i?'cur':''}" aria-label="第 ${q.i+1} 題">${q.i+1}</button>`).join('')}</div>`;
}
function show(i){
  cur={...DATA.qs[i],i};typed='';tries=0;done=!!S.res[i];

  $('#main').innerHTML=`${dotsHTML()}

    <div class="q" id="q">${esc(cur.q)}</div>
    <div class="ansrow"><span>=</span><div class="ans" id="ans" aria-live="polite"></div></div>

    <div id="help"></div>
    <div id="ctl"></div>`;
  $('#main').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>show(+b.dataset.q));

}
function drawAns(){const a=$('#ans');if(!a)return;a.classList.remove('wrong');
  a.innerHTML=typed?`<span class="${typed.startsWith(M)?'neg':''}">${typed}</span>`:'<span class="ph">用下面的按鍵輸入答案</span>';}
function padMode(){
  $('#ctl').innerHTML=`<div class="pad">
    ${[7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="back" aria-label="退一格">⌫</button>
    ${[4,5,6].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="neg" class="neg-k" aria-label="負號">− 負號</button>
    ${[1,2,3].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="go" class="go">送出</button>
    <button data-k="0" class="wide">0</button><button data-k="clr" style="font-size:1em">清除</button></div>`;
  $('#ctl').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
}
function key(k){
  if(done) return;
  if(/^\d$/.test(k)){const digits=typed.replace(M,'');if(digits.length<4) typed=(digits==='0'?typed.replace('0',''):typed)+k;}
  else if(k==='neg'){typed=typed.startsWith(M)?typed.slice(1):M+typed;}
  else if(k==='back'){typed=typed.slice(0,-1);}
  else if(k==='clr'){typed='';}
  else if(k==='go'){check();return;}
  drawAns();
}
document.addEventListener('keydown',e=>{
  if(!cur||e.target.id==='nm') return;
  if(done){if(e.key==='Enter'){const b=$('#nextBtn');if(b){e.preventDefault();b.click();}}return;}
  if(/^\d$/.test(e.key)) key(e.key);
  else if(e.key==='-'||e.key==='−') key('neg');
  else if(e.key==='Backspace') key('back');
  else if(e.key==='Enter'){e.preventDefault();key('go');}
});
function check(){
  if(!typed||typed===M){$('#msg').innerHTML='<span class="neg">先輸入答案。</span>';return;}
  const v=Number(typed.replace(M,'-'));
  tries++;
  if(v===cur.a){finish(tries===1?'first':'second');return;}
  $('#ans').classList.add('wrong');
  if(tries===1){
    $('#msg').innerHTML='<span class="neg">不對喔，看看提示再試一次。</span>';
    $('#help').innerHTML=`<div class="hint"><b>提示</b>${esc(DATA.hints[cur.lv-1])}</div>`;
    typed='';setTimeout(drawAns,450);

}
function stepsHTML(q){return `<div class="steps"><b>解題步驟</b><ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="fin">答案：<span class="${q.a<0?'neg':''}">${sn(q.a)}</span></div></div>`;}
function finish(res){

function reviewMode(){
  const r=S.res[cur.i];
  typed=sn(cur.a);
  $('#msg').innerHTML=r==='first'?'<span class="okc">這題已經答對 ★</span>':r==='second'?'<span class="okc">這題第二次答對 ☆</span>':'<span class="neg">這題沒答對，可以在成績頁重做錯題。</span>';
  $('#help').innerHTML=r==='miss'?stepsHTML(cur):'';
  nextControls();
}
function result(){
  cur=null;
  const st=lvStat(S.lv);const qs=lvQs(S.lv);const misses=qs.filter(q=>S.res[q.i]==='miss'||S.res[q.i]==='second');
  const ok=st.first+st.second;const pass=ok>=18;
  $('#main').innerHTML=`<div class="result">${dotsHTML()}
    <h2>${LV[S.lv-1].name}完成${S.name?`・${esc(S.name)}`:''}</h2>
    <div class="score">${ok}<small> / 20 題答對</small></div>
    <div class="stars"><span class="okc">★ 一次答對 ${st.first}</span><span>☆ 第二次答對 ${st.second}</span><span class="neg">✗ 沒答對 ${st.miss}</span></div>
    <p>${pass?(S.lv<5?'很棒！可以進下一關了。':'五關全部完成，太厲害了！'):'答對 18 題以上再進下一關。先把錯的題目重做一次吧。'}</p>
    ${misses.length?`<details ${pass?'':'open'}><summary>要再練的題目（${misses.length} 題）</summary><ul class="misslist">${misses.map(q=>`<li><span>${q.i+1}. ${esc(q.q)}</span><span>${sn(q.a)}</span></li>`).join('')}</ul></details>`:''}
    <div class="btns">
      ${misses.length?'<button class="btn main" id="redo">重做錯的題目</button>':''}
      ${S.lv<5?`<button class="btn ${misses.length?'':'main'}" id="nextLv">前往第 ${S.lv+1} 關</button>`:''}
      <button class="btn alt" id="again">整關重新開始</button>
    </div></div>`;
  $('#main').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>show(+b.dataset.q));
  if($('#redo')) $('#redo').onclick=()=>{misses.forEach(q=>S.res[q.i]=null);save();openLevel();};
  if($('#nextLv')) $('#nextLv').onclick=()=>{S.lv++;save();openLevel();};
  $('#again').onclick=()=>{
    $('#again').outerHTML='<span>確定清除這一關的紀錄？</span><button class="btn main" id="againY">清除重來</button><button class="btn alt" id="againN">取消</button>';
    $('#againY').onclick=()=>{qs.forEach(q=>S.res[q.i]=null);save();openLevel();};
    $('#againN').onclick=result;
  };
}
$('#nm').value=S.name||'';
$('#nm').oninput=e=>{S.name=e.target.value.trim();save();};
drawNumberLine();
if(window.MathSync&&MathSync.enabled){MathSync.start(u=>{if(u){S=load();S.name=u.name||S.name;const nm=$('#nm');if(nm){nm.value=S.name;nm.readOnly=true;}}openLevel();});}
else openLevel();
</script>
